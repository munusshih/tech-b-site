name: Daily notebook refresh

on:
  schedule:
    - cron: "17 3 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-notebook-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Pull notebook responses
        run: npm run sync

      - name: Verify the refreshed site
        run: npm run build:static

      - name: Publish refreshed notebook data
        shell: bash
        run: |
          current_year="$(node -p "require('./src/course-config.json').activeYear")"
          git add "src/data/${current_year}" "public/student-files/${current_year}"
          if git diff --cached --quiet; then
            echo "No new or changed notebook responses."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh notebook responses"
          git push
