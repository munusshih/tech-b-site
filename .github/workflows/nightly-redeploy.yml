name: Daily Vercel Content Refresh

on:
  schedule:
    - cron: "17 3 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-vercel-content-refresh
  cancel-in-progress: true

jobs:
  redeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::error::The VERCEL_DEPLOY_HOOK repository secret is not configured."
            exit 1
          fi

          response="$(curl --fail --show-error --silent \
            --retry 3 --retry-all-errors \
            --request POST "$VERCEL_DEPLOY_HOOK")"

          echo "$response" | jq --exit-status '.job.id and .job.state' >/dev/null
          echo "Vercel accepted the daily content-refresh deployment."
